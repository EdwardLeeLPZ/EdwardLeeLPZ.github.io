- title: Work Experience
  type: time_table
  contents:
    - title: Industrial Ph.D. Researcher
      institution: Mercedes-Benz Group AG, Stuttgart, Germany
      department: Scene Understanding Group, R&D
      year: 2023 - Present
      description:
        - "Lead a research line on open-world 3D occupancy, label-free 3D pseudo-labeling, and spatial VLMs for driving; co-author SeFlow (scene flow), TQD-Track (3D tracking), and G2DP (planning); mentor 2 research interns and 1 master's student."
        - 'Open-vocabulary 3D occupancy auto-labeling (<a href="/projects/occupancy-auto-labeling-pipeline/">project page</a>): built and ran a label-free pipeline on production-fleet recordings (5 surround cameras + LiDAR) that fuses multi-frame LiDAR and 2D open-vocabulary semantics into 3D semantic voxel labels, then distills them into a single-frame model delivered to the vehicle team; labeled 1,500 episodes (30,000 keyframes) with no human annotation within a $5K labeling budget (full 42,538-clip archive est. $199K); validated free space without ground truth by split-episode LiDAR replay (0.11% false-free rate vs. 2.18% for forward ray casting); traced ghost voxels to an int16 cache overflow (87% fewer after the fix); cut per-episode cost 36%.'
        - 'AGO (ICCV 2025, 1st author, <a href="https://edwardleelpz.github.io/AGO_Page/">project page</a>): open-world 3D occupancy trained without 3D annotation: 2D open-vocabulary masks lifted to 3D pseudo-labels via LiDAR projection, multi-frame aggregation, and ray casting; a modality adapter aligns 3D embeddings to VLM image embeddings for zero-shot and few-shot novel-class prediction; state of the art at publication on self-supervised Occ3D-nuScenes (+4.09 mIoU).'
        - 'SpaceDrive (CVPR 2026, co-first author, <a href="https://zhenghao2519.github.io/SpaceDrive_Page/">project page</a>): E2E spatial VLA that replaces textual digit tokens with a unified 3D positional encoding, without dense BEV features; state-of-the-art nuScenes open-loop planning among VLA-based methods (0.32 m avg. L2 with ego status, 1.80 m without) and 78.02 driving score on Bench2Drive closed loop.'
        - "COURSE (1st author, in preparation): world-action model for E2E driving trained on a counterfactual causal tree, where an action-conditioned latent transition model rolls logged scenes forward under alternative ego maneuvers to supervise the planner (NAVSIM)."
        - "Scale training and evaluation on on-premise SLURM clusters and cloud (Flyte, Kubernetes, Azure, GCP); e.g., cut distillation step time 3.29× by caching frozen vision-language teacher targets."
    - title: Master Student
      institution: Mercedes-Benz Group AG, Stuttgart, Germany
      department: Scene Understanding Group, R&D
      year: 2022
      description:
        - 'PowerBEV (IJCAI 2023, co-first author, <a href="https://github.com/EdwardLeeLPZ/PowerBEV/">project page</a>): camera-only E2E BEV perception and future instance prediction with Lift-Splat-Shoot view transformation and centripetal backward flow, replacing two-stage post-processing with one-step association; 62.5% / 39.3% IoU (short / long range) on nuScenes.'
        - "Designed a multi-stage temporal GCN for the Waymo Occupancy and Flow Prediction Challenge; achieved 74.2% Flow-Grounded Occupancy AUC and ranked 4th on the leaderboard."
    - title: Research Intern
      institution: Mercedes-Benz Group AG, Stuttgart, Germany
      department: Scene Understanding Group, R&D
      year: 2021
      description:
        - "Studied contextual bias in 2D object detection and domain adaptation; showed disruptive context reduced mAP by 5.37%, and built context-separation components for internal adaptation research."

